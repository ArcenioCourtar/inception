services:
  nginx:
    build:
      context: requirements/nginx
    container_name: nginx
    depends_on:
      - wordpress
    networks:
      - inception
    ports:
      - "443:443"
    restart: always

  wordpress:
    build:
      context: requirements/wordpress
    container_name: wordpress
    depends_on:
      - mariadb
    networks:
      - inception
    volumes:
      - wp_vol:/var/www/html

  mariadb:
    build:
      context: requirements/mariadb
    container_name: mariadb
    networks:
      - inception
    volumes:
      - db_vol:/var/lib/mysql
#-----------------
networks:
  inception:
    driver: bridge
#--------------------
volumes:
  db_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/acourtar/data/mariadb
  wp_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/acourtar/data/wordpress
